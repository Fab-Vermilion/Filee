<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Filee 转换服务</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">◉</span>
        <div>
          <h1>Filee 文件转换</h1>
          <p id="session-note" class="subtle">正在读取会话…</p>
        </div>
      </div>
      <a href="/manual.html" class="ghost back-link">使用手册</a>
    </header>

    <section class="card workspace">
      <!-- 第一步：文件 -->
      <div class="upload-pane">
        <h2 class="pane-title"><span class="step">1</span> 添加文件</h2>
        <label id="dropzone" class="dropzone" for="files">
          <span class="drop-icon" aria-hidden="true">＋</span>
          <span class="drop-text">点击选择文件</span>
          <span class="drop-hint">支持批量 · 最多 20 个文件转为同一种目标格式</span>
          <input id="files" type="file" multiple />
        </label>
        <div id="file-list" class="file-list"></div>
        <button id="add-more" type="button" class="ghost" hidden>＋ 继续添加文件</button>
        <p id="message" role="status"></p>
      </div>

      <!-- 第二步：格式 -->
      <div class="donut-pane">
        <h2 class="pane-title"><span class="step">2</span> 选择目标格式</h2>
        <p id="format-hint" class="hint">先添加文件，系统会检测格式并列出可转换的目标。</p>
        <div id="category-list" class="chips" role="tablist" aria-label="可转换的目标分类"></div>
        <div id="donut" class="donut-wrap" role="group" aria-label="目标格式选择"></div>
        <p class="target-line">当前目标：<strong id="target-label">待选择</strong></p>
        <label class="sr-only" for="target">目标格式</label>
        <select id="target" class="sr-only" aria-label="目标格式（键盘可访问）"></select>
      </div>
    </section>

    <div class="submit-row">
      <button id="submit" type="button" disabled>开始转换</button>
      <button id="retry" type="button" class="ghost" hidden>重新进入应用</button>
    </div>

    <section class="card">
      <h2 class="pane-title"><span class="step">3</span> 任务进度</h2>
      <p class="storage-note">任务记录、转换文件与下载链接在服务器上保留 <strong>24 小时</strong>后自动清理。请在有效期内下载并妥善保存文件。</p>
      <div class="job-tabs" role="tablist" aria-label="任务分类">
        <button id="tab-current" type="button" class="job-tab on" role="tab" aria-selected="true">当前任务 <span id="current-count" class="tab-count">0</span></button>
        <button id="tab-history" type="button" class="job-tab" role="tab" aria-selected="false">历史记录 <span id="history-count" class="tab-count">0</span></button>
      </div>
      <div id="job-list"></div>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>

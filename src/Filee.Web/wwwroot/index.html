<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Filee 转换服务</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">◉</span>
        <div>
          <h1>Filee 文件转换</h1>
          <p id="session-note" class="subtle">正在读取会话…</p>
        </div>
      </div>
    </header>

    <section class="card workspace">
      <div class="donut-pane">
        <h2 class="pane-title">选择目标格式</h2>
        <div id="category-list" class="chips" role="tablist" aria-label="格式分类"></div>
        <div id="donut" class="donut-wrap" role="group" aria-label="目标格式选择"></div>
        <p class="target-line">当前目标：<strong id="target-label">加载中…</strong></p>
        <label class="sr-only" for="target">目标格式</label>
        <select id="target" class="sr-only" aria-label="目标格式（键盘可访问）"></select>
      </div>

      <div class="upload-pane">
        <h2 class="pane-title">添加文件</h2>
        <label id="dropzone" class="dropzone" for="files">
          <span class="drop-icon" aria-hidden="true">＋</span>
          <span class="drop-text">点击选择或拖入文件</span>
          <span class="drop-hint">支持批量</span>
          <input id="files" type="file" multiple />
        </label>
        <div class="actions">
          <button id="submit" type="button" disabled>开始转换</button>
          <button id="retry" type="button" class="ghost" hidden>重新进入应用</button>
        </div>
        <p id="message" role="status"></p>
      </div>
    </section>

    <section class="card">
      <h2 class="pane-title">任务进度</h2>
      <div id="job-list"></div>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
